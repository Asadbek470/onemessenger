<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzMessenger Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body class="adminbody">

  <!-- LOGIN SCREEN (separate from any regular user account) -->
  <div id="adminLoginScreen" class="admin-login-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">UM</div>
        <div>
          <h1>Admin Panel</h1>
          <p>Отдельный вход, не связан с обычными аккаунтами</p>
        </div>
      </div>
      <div class="form">
        <label>Логин</label>
        <input id="adminLoginInput" placeholder="admin" autocomplete="off" />
        <label>Пароль</label>
        <input id="adminPasswordInput" type="password" placeholder="••••" autocomplete="off" onkeydown="if(event.key==='Enter') adminLogin()" />
        <button class="btn primary full" onclick="adminLogin()">Войти</button>
        <div id="adminLoginError" class="passcode-error"></div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="adminDashboard" class="admin-container hidden">
    <div class="admin-topbar">
      <h1>UzMessenger • Admin Panel</h1>
      <button class="btn ghost" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
    </div>

    <div class="admin-tabs">
      <button class="admintab active" data-tab="users" onclick="switchAdminTab('users')">Пользователи</button>
      <button class="admintab" data-tab="verification" onclick="switchAdminTab('verification')">Верификация</button>
      <button class="admintab" data-tab="support" onclick="switchAdminTab('support')">Поддержка</button>
      <button class="admintab" data-tab="sessions" onclick="switchAdminTab('sessions')">Сессии</button>
    </div>

    <!-- USERS TAB -->
    <div id="tabUsers" class="admintabpanel">
      <div class="admin-search">
        <input id="searchUser" placeholder="Поиск @username" onkeydown="if(event.key==='Enter') searchUser()">
        <button onclick="searchUser()">Найти</button>
      </div>

      <div id="userList" class="user-list"></div>

      <div id="userCard" class="user-card hidden">
        <div class="user-info">
            <img id="userAvatar">
            <div>
                <h2 id="userName"></h2>
                <p id="userUsername"></p>
                <p id="userBio"></p>
                <p id="userFlags"></p>
            </div>
        </div>

        <div class="admin-actions">
            <button onclick="banUser()" class="danger">Забанить</button>
            <button onclick="unbanUser()" class="success">Разбанить</button>
            <button onclick="muteUser()">Мут</button>
            <button onclick="unmuteUser()">Размут</button>
            <button onclick="deleteUser()" class="danger">Удалить аккаунт</button>
        </div>

        <div class="row">
          <button class="btn ghost full" onclick="revealUserOverview()">
            <i class="fa-solid fa-lock"></i> Показать переписки / сессии / контакты (код доступа)
          </button>
        </div>

        <div id="userOverviewBox" class="admin-overview hidden">
          <div class="overview-col">
            <h3>Личные переписки</h3>
            <div id="partnerList" class="partner-list"></div>
          </div>
          <div class="overview-col">
            <h3>Группы и каналы</h3>
            <div id="groupList" class="partner-list"></div>
          </div>
          <div class="overview-col">
            <h3>Сохранённые контакты</h3>
            <div id="userContactsList" class="partner-list"></div>
          </div>
        </div>
      </div>

      <div id="threadViewer" class="thread-viewer hidden">
        <div class="thread-head">
          <h3 id="threadTitle">Переписка</h3>
          <button class="iconbtn" onclick="closeThread()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="threadMessages" class="thread-messages"></div>
      </div>
    </div>

    <!-- MESSAGE UNLOCK MODAL — отдельный длинный код для чтения переписок.
         Обычного входа в админку недостаточно, чтобы открыть чью-то переписку. -->
    <div id="msgUnlockModal" class="admin-login-wrap hidden" style="position:fixed;inset:0;z-index:999;">
      <div class="auth-card">
        <div class="brand">
          <div class="logo"><i class="fa-solid fa-lock"></i></div>
          <div>
            <h1>Код доступа</h1>
            <p>Чтение переписок закрыто отдельным кодом</p>
          </div>
        </div>
        <div class="form">
          <label>Код разблокировки</label>
          <input id="msgUnlockInput" type="password" placeholder="Введите код" autocomplete="off" onkeydown="if(event.key==='Enter') submitMsgUnlockCode()">
          <button class="btn primary full" onclick="submitMsgUnlockCode()">Разблокировать</button>
          <button class="btn ghost full" onclick="closeMsgUnlockModal()">Отмена</button>
          <div id="msgUnlockError" class="passcode-error"></div>
        </div>
      </div>
    </div>

    <!-- VERIFICATION TAB -->
    <div id="tabVerification" class="admintabpanel hidden">
      <div id="verificationList" class="ver-list"></div>
    </div>

    <!-- SUPPORT TAB -->
    <div id="tabSupport" class="admintabpanel hidden">
      <div id="supportConversations" class="user-list"></div>
      <div id="supportThreadViewer" class="thread-viewer hidden">
        <div class="thread-head">
          <h3 id="supportThreadTitle">Обращение</h3>
          <button class="iconbtn" onclick="closeSupportThread()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="supportThreadMessages" class="thread-messages"></div>
        <div class="support-reply-row">
          <input id="supportReplyInput" placeholder="Ответ пользователю..." onkeydown="if(event.key==='Enter') sendSupportReply()">
          <button onclick="sendSupportReply()">Отправить</button>
        </div>
      </div>
    </div>

    <!-- SESSIONS TAB -->
    <div id="tabSessions" class="admintabpanel hidden">
      <div class="admin-search">
        <input id="searchSessions" placeholder="Фильтр по @username" onkeydown="if(event.key==='Enter') loadAdminSessions()">
        <button onclick="loadAdminSessions()">Найти</button>
      </div>
      <div id="sessionsList" class="ver-list"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
