<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>One Messenger</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- DEVICE PASSCODE LOCK -->
  <div id="passcodeOverlay" class="passcode-overlay hidden">
    <div class="passcode-box">
      <div class="logo">OM</div>
      <h2>Введи код-пароль</h2>
      <input id="passcodeInput" type="password" inputmode="numeric" maxlength="8" autofocus onkeydown="passcodeKeydown(event)">
      <div id="passcodeError" class="passcode-error"></div>
      <button class="btn primary full" onclick="unlockAttempt()">Разблокировать</button>
    </div>
  </div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="side-top">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" placeholder="Поиск @username..." oninput="searchUsers(this.value)" />
        </div>

        <div class="stories">
          <button class="story-add" onclick="openStoryComposer()" title="Добавить сторис">
            <i class="fa-solid fa-plus"></i>
          </button>
          <div id="storiesList" class="stories-list"></div>
        </div>

        <div class="sidebar-actions">
          <button class="btn ghost small" onclick="openCreateGroupModal(false)"><i class="fa-solid fa-users"></i> Группа</button>
          <button class="btn ghost small" onclick="openCreateGroupModal(true)"><i class="fa-solid fa-bullhorn"></i> Канал</button>
        </div>
      </div>

      <div class="chatlist" id="chatList">
        <button class="chatitem active" data-chat="global" onclick="openChat('global')">
          <div class="avatar circle"><i class="fa-solid fa-earth-americas"></i></div>
          <div class="meta">
            <div class="name">Общий чат</div>
            <div class="preview">общение со всеми</div>
          </div>
          <span class="dot online" title="Онлайн"></span>
        </button>

        <div id="privateChats"></div>
        <div id="searchResults"></div>
      </div>

      <div class="side-bottom">
        <button class="btn ghost full" onclick="openSettings()">
          <i class="fa-solid fa-circle-user"></i>
          Настройки профиля
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="iconbtn mobile" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

        <div class="title" onclick="openCurrentProfile()" title="Открыть профиль" style="cursor:pointer;">
          <div id="chatTitle" class="h">Общий чат</div>
          <div class="sline">
            <div id="chatSub" class="s">общение со всеми</div>
            <div id="typingLine" class="typing hidden">печатает…</div>
          </div>
        </div>

        <div class="actions">
          <button id="callBtn" class="iconbtn" onclick="startAudioCall()" title="Аудиозвонок">
            <i class="fa-solid fa-phone"></i>
          </button>
          <button class="iconbtn" onclick="logout()" title="Выйти">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <div id="birthdayBanner" class="banner hidden"></div>

      <section id="messages" class="messages"></section>

      <footer class="composer">
        <div class="attachwrap">
          <button class="iconbtn" onclick="toggleAttachMenu()" title="Прикрепить">
            <i class="fa-solid fa-paperclip"></i>
          </button>
          <div id="attachMenu" class="attachmenu hidden">
            <button onclick="attachPickMedia()"><i class="fa-solid fa-image"></i> Фото/Видео</button>
            <button onclick="attachPickList()"><i class="fa-solid fa-list-check"></i> Список (покупки, дела)</button>
          </div>
        </div>
        <input id="fileInput" type="file" hidden accept="image/*,video/*" onchange="sendMedia(this)" />

        <input id="textInput" class="text" placeholder="Сообщение..." onkeydown="onEnter(event)" oninput="typing(true)" />

        <button id="voiceBtn" class="iconbtn" onmousedown="startHoldVoice()" onmouseup="stopHoldVoice()" ontouchstart="startHoldVoice()" ontouchend="stopHoldVoice()" title="Голосовое (удерживай)">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button class="iconbtn send" onclick="sendText()" title="Отправить">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </footer>
    </main>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal hidden">
    <div class="card">
      <div class="cardtop">
        <div class="cardtitle" id="profileTitle">Профиль</div>
        <button class="iconbtn" onclick="closeProfile()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="profile">
        <div class="avatar big" id="profileAvatar"></div>
        <div class="profiletext">
          <div class="pname" id="profileName"></div>
          <div class="puser" id="profileUser"></div>
          <div class="pbio" id="profileBio"></div>
          <div class="pbirth" id="profileBirth"></div>
        </div>
      </div>

      <div id="profileActions" class="row"></div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="modal hidden">
    <div class="card cardwide">
      <div class="cardtop">
        <div class="cardtitle">Настройки</div>
        <button class="iconbtn" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="settingsscroll">
        <div class="settingsblock">
          <div class="blocktitle">Профиль</div>
          <div class="formgrid">
            <label>Display name</label>
            <input id="setDisplayName" placeholder="Имя" />

            <label>Bio</label>
            <input id="setBio" placeholder="О себе" />

            <label>Дата рождения (YYYY-MM-DD)</label>
            <input id="setBirthDate" placeholder="2009-01-31" />

            <label>Аватар (URL)</label>
            <input id="setAvatarUrl" placeholder="https://..." />

            <button class="btn primary full" onclick="saveProfile()">Сохранить профиль</button>
          </div>
        </div>

        <div class="settingsblock">
          <div class="blocktitle">Оформление</div>
          <div id="wallpaperSection" class="formgrid"></div>
        </div>

        <div class="settingsblock">
          <div class="blocktitle">Код-пароль устройства</div>
          <div id="passcodeSection" class="formgrid"></div>
        </div>

        <div class="settingsblock">
          <div class="blocktitle">Двухэтапная аутентификация</div>
          <div id="twoFASection" class="formgrid"></div>
        </div>

        <div class="settingsblock">
          <div class="blocktitle">Официальная верификация</div>
          <div id="verificationSection" class="formgrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CREATE GROUP/CHANNEL -->
  <div id="groupModal" class="modal hidden">
    <div class="card">
      <div class="cardtop">
        <div class="cardtitle" id="groupModalTitle">Новая группа</div>
        <button class="iconbtn" onclick="closeCreateGroupModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="formgrid">
        <input id="groupIsChannel" type="hidden" value="0">
        <label>Название</label>
        <input id="groupName" placeholder="Например: Семья">

        <label>Описание (не обязательно)</label>
        <input id="groupDesc" placeholder="Пара слов о группе">

        <label>Друзья/родные для добавления (через запятую, @username)</label>
        <input id="groupMembers" placeholder="@friend1, @friend2">

        <button class="btn primary full" onclick="submitCreateGroup()">Создать</button>
      </div>
    </div>
  </div>

  <!-- GROUP INFO -->
  <div id="groupInfoModal" class="modal hidden">
    <div class="card">
      <div class="cardtop">
        <div class="cardtitle" id="groupInfoTitle">Группа</div>
        <button class="iconbtn" onclick="closeGroupInfo()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="formgrid">
        <div id="groupInfoDesc" class="hint"></div>

        <div id="groupAddMemberRow" class="row hidden">
          <input id="groupAddMemberInput" placeholder="@username">
          <button class="btn ghost" onclick="addGroupMember()">Добавить</button>
        </div>

        <div id="groupMembersList"></div>

        <button id="groupLeaveBtn" class="btn danger full">Покинуть группу</button>
      </div>
    </div>
  </div>

  <!-- SHOPPING / TO-DO LIST COMPOSER -->
  <div id="listModal" class="modal hidden">
    <div class="card">
      <div class="cardtop">
        <div class="cardtitle">Новый список</div>
        <button class="iconbtn" onclick="closeListComposer()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="formgrid">
        <label>Название списка</label>
        <input id="listTitle" placeholder="Например: Список покупок">

        <label>Пункты</label>
        <div id="listItemRows"></div>
        <button class="btn ghost" onclick="addListRow()"><i class="fa-solid fa-plus"></i> Добавить пункт</button>

        <button class="btn primary full" onclick="publishList()">Отправить список</button>
      </div>
    </div>
  </div>

  <!-- STORY COMPOSER -->
  <div id="storyModal" class="modal hidden">
    <div class="card">
      <div class="cardtop">
        <div class="cardtitle">Новая сторис</div>
        <button class="iconbtn" onclick="closeStoryComposer()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="formgrid">
        <label>Файл (не обязательно)</label>
        <input id="storyFile" type="file" accept="image/*,video/*" />

        <label>Текст (не обязательно)</label>
        <input id="storyText" maxlength="120" placeholder="Текст..." />

        <button class="btn primary full" onclick="publishStory()">Опубликовать</button>
      </div>
    </div>
  </div>

  <!-- AUDIO CALL -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <div id="incomingCallModal" class="modal hidden">
    <div class="card callcard">
      <div class="callbg"></div>
      <div class="callbody callbody-incoming">
        <div class="call-avatar-ring">
          <div class="call-avatar" id="incomingCallAvatar"></div>
        </div>
        <div id="incomingCallText" class="callstatus">Кто-то звонит…</div>
        <div class="call-sub">Аудиозвонок</div>
        <div class="row call-actions-row">
          <button class="callbtn callbtn-reject" onclick="declineIncomingCall()" title="Отклонить"><i class="fa-solid fa-phone-slash"></i></button>
          <button class="callbtn callbtn-accept" onclick="acceptIncomingCall()" title="Принять"><i class="fa-solid fa-phone"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div id="callModal" class="modal hidden">
    <div class="card callcard">
      <div class="callbg"></div>
      <div class="callbody">
        <div class="call-avatar-ring" id="callAvatarRing">
          <div class="call-avatar" id="callAvatar"></div>
        </div>
        <div id="callTitle" class="calltitle">Аудиозвонок</div>
        <div id="callStatus" class="callstatus">Соединение...</div>
        <div id="callTimer" class="call-timer hidden">00:00</div>
        <div class="row call-actions-row">
          <button id="muteBtn" class="callbtn callbtn-ghost" onclick="toggleMute()" title="Микрофон"><i class="fa-solid fa-microphone"></i></button>
          <button class="callbtn callbtn-reject" onclick="endCall()" title="Завершить"><i class="fa-solid fa-phone-slash"></i></button>
          <button id="speakerBtn" class="callbtn callbtn-ghost" onclick="toggleSpeaker()" title="Звук"><i class="fa-solid fa-volume-high"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
